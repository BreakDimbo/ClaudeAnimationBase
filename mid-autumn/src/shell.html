<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第十六个月饼</title>
<style>
  :root { --bg: #1d2138; --fg: #efe6d2; --accent: #f2b845; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 10px; }
  #cv { width: 100%; height: auto; aspect-ratio: 16 / 9; display: block; background: #F3E9D4; border-radius: 4px; }
  .bar { display: flex; gap: 10px; align-items: center; }
  .bar button { background: var(--accent); color: #1d2138; border: 0; border-radius: 4px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
  #scrub { flex: 1; accent-color: var(--accent); }
  #tt { font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; opacity: .8; }
  body.render main { padding: 0; max-width: none; } body.render .bar { display: none; }
</style>
</head>
<body>
<main>
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div class="bar"><button id="play">▶ 播放</button><input id="scrub" type="range" min="0" max="180" step="0.0416667" value="0"><span id="tt">0.00 s</span></div>
</main>
<script>
/*INJECT*/
</script>
</body>
</html>
